<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe5"><meta name="description" content="日晷 · 一卷山河。免费古代水墨抽卡与图鉴小游戏。">
  <title>日晷 · 一卷山河</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/chancellor-v3.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/presentation.css">
  <link rel="stylesheet" href="./src/mobile.css">
</head>
<body>
  <div id="game-root">
    <div id="app"><p class="boot">日晷 · 正在展卷</p></div>
    <dialog id="modal" aria-label="游戏面板"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="rotate" role="status" aria-live="polite">
    <span aria-hidden="true">↻</span>
    <h2>日晷需横屏体验</h2>
    <p><b class="rotate-countdown">3</b> 秒后自动转为横屏模式</p>
    <small>也可以现在横置手机</small>
  </div>
  <noscript>请启用 JavaScript 以游玩日晷。</noscript>
<script type="module" src="./src/app2.js"></script>
</body>
</html>
