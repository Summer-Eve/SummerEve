<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日晷 · 提示与星级审核</title><link rel="stylesheet" href="./src/styles.css"><link rel="stylesheet" href="./src/presentation.css"><style>body{padding:36px;max-width:1080px;margin:auto}.review-head{display:flex;justify-content:space-between;gap:25px;align-items:center}.review-head h1{font-size:30px}.review-head p{font-size:12px;color:var(--muted)}.review-head a{color:var(--ink);font-size:12px}.review-pull{padding:30px;border:1px solid var(--line);display:flex;justify-content:center;margin:12px 0 30px;background:#ebe5d9}.review-pull .pull-area{width:540px}.review-pull .pity{font-size:14px}.review-pull .pull{padding:19px}.review-pull .hint{font-size:12px;margin-top:16px}.review-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.review-cards .card{cursor:default}.review-cards .card:hover{transform:none;box-shadow:none}.review-cards h3{font:15px var(--serif);margin-bottom:10px}.review-legend{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.review-legend small{font-size:10px}.review-foot{font-size:12px;color:var(--muted);margin-top:22px}@media(max-width:700px){body{padding:20px}.review-cards{grid-template-columns:repeat(2,1fr)}.review-pull{padding:12px}.review-pull .pull-area{min-width:0;width:100%}.review-pull .pity{font-size:11px}.review-pull .pull{font-size:18px;min-width:0;padding:14px 9px}}</style></head><body><header class="review-head"><div><h1>抽卡提示与星级 · 审核稿</h1><p>仅供界面审核，以下为演示数据，不读取或修改游戏存档。</p></div><a href="./">返回本地游戏</a></header><main id="review"></main><script type="module" src="./src/review.js"></script></body></html>
